  const S = crypto.subtle, te = new TextEncoder();
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64 = (u8) => btoa(String.fromCharCode(...u8));
  const sha = async (s) => new Uint8Array(await S.digest("SHA-256", te.encode(s)));
  const hex = (u8) => [...u8].map((x) => x.toString(16).padStart(2, "0")).join("");
  const get = (st, k) => { try { return st.getItem(k); } catch { return null; } };
  const set = (st, k, v) => { try { st.setItem(k, v); } catch {} };
  const del = (st, k) => { try { st.removeItem(k); } catch {} };

  async function aes(raw, iv, data) {
    const key = await S.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    return new Uint8Array(await S.decrypt({ name: "AES-GCM", iv }, key, data));
  }
  async function kekFor(name, pw) {
    const salt = (await sha("unilistde-salt:" + name)).slice(0, 16);
    const base = await S.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await S.deriveBits({ name: "PBKDF2", salt, iterations: KEYRING.iter, hash: "SHA-256" }, base, 256));
  }
  async function unwrap(name, kek) {
    const entry = KEYRING.users[hex(await sha("unilistde-user:" + name))];
    if (!entry) throw new Error("unknown");
    return aes(kek, unb64(entry.iv), unb64(entry.k));
  }
  // the user's own key stays in this tab; the page and the data unwrap the current content key with it
  async function open(name, kek) {
    const cek = await unwrap(name, kek);
    const sealed = unb64(PAGE);
    const zipped = await aes(cek, sealed.slice(0, 12), sealed.slice(12));
    const html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    set(sessionStorage, "unilistde.user", JSON.stringify({ n: name, k: b64(kek) }));
    document.open();
    document.write(html);
    document.close();
  }

  async function auto() {
    del(sessionStorage, "unilistde.cek"); // from the first version of this page
    for (const [st, key] of [[sessionStorage, "unilistde.user"], [localStorage, "unilistde.remember"]]) {
      const v = get(st, key);
      if (!v) continue;
      try { const { n, k } = JSON.parse(v); return await open(n, unb64(k)); }
      catch { del(st, key); }
    }
    document.body.classList.remove("wait");
    document.getElementById("u").focus();
  }

  document.getElementById("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById("b"), err = document.getElementById("e");
    const name = document.getElementById("u").value.trim().toLowerCase();
    const pw = document.getElementById("p").value;
    btn.disabled = true; btn.textContent = "Signing in…"; err.textContent = "";
    try {
      const kek = await kekFor(name, pw);
      await unwrap(name, kek); // throws on a wrong username or password
      if (document.getElementById("r").checked) set(localStorage, "unilistde.remember", JSON.stringify({ n: name, k: b64(kek) }));
      await open(name, kek);
    } catch {
      err.textContent = "Wrong username or password.";
      btn.disabled = false; btn.textContent = "Sign in";
      document.getElementById("p").select();
    }
  });

  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
    document.body.classList.remove("wait");
    document.getElementById("e").textContent = "This browser is too old to open the site. Please update it.";
    document.getElementById("b").disabled = true;
  } else auto();
})();
</script>
</body>
</html>
